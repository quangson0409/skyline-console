server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Every API call goes through audit-proxy (audit-proxy/), which records POST/PUT/PATCH/DELETE and forwards
    # the request unchanged to Skyline (UPSTREAM_API=http://10.0.29.10:9999) and to the backup scheduler.
    # Change the address below to where audit-proxy runs. If it is down the console answers 502.
    location /api/ {
        proxy_pass http://audit-proxy:8788;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 75s;
        # Swift uploads/downloads can be several GB: no body size limit (default 1m answers 413 and the browser
        # shows "network error"), stream both directions and allow slow HDD-backed storage up to an hour.
        client_max_body_size 0;
        client_body_timeout 3600s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        send_timeout 3600s;
    }

    # backup scheduler (audit-proxy rewrites /scheduler-api/* to <scheduler>/api/v1/*)
    location /scheduler-api/ {
        proxy_pass http://audit-proxy:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # audit log viewer API (token is validated by audit-proxy, users only see their own events)
    location /audit-api/ {
        proxy_pass http://audit-proxy:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
